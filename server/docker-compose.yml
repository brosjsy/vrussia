# Everything on one VPS with Docker: PostgreSQL 17 and the server. PostgreSQL is reachable only inside this compose network (no port is
# published to the internet); the server is published on 127.0.0.1:8080 for nginx on the host (see ops/nginx/vrussia.conf).
# Secrets come from files that are not in git: ./secrets/postgres_password and /etc/vrussia/server.env.
# If you prefer PostgreSQL installed directly on the VPS (recommended in docs/DEPLOY_VPS.md), use only the "api" service.
services:
  db:
    image: postgres:17.6-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: vrussia
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --data-checksums
    secrets: [postgres_password]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backups:/backups
    # the same hardening as ops/postgres/vrussia.conf, as start-up flags
    command: ["postgres", "-c", "password_encryption=scram-sha-256", "-c", "log_connections=on", "-c", "log_disconnections=on", "-c", "log_min_duration_statement=1000", "-c", "log_statement=ddl", "-c", "idle_in_transaction_session_timeout=60s", "-c", "shared_buffers=256MB"]
    networks: [internal]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U postgres -d vrussia"], interval: 10s, timeout: 5s, retries: 5 }
  api:
    build: .
    restart: unless-stopped
    env_file: /etc/vrussia/server.env
    environment:
      HOST: 0.0.0.0
      DATABASE_SSL: "off"           # the database is on the private compose network only
    depends_on: { db: { condition: service_healthy } }
    ports: ["127.0.0.1:8080:8080"]
    networks: [internal]
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
networks:
  internal: {}
volumes:
  pgdata: {}
secrets:
  postgres_password: { file: ./secrets/postgres_password }
