# PostgreSQL client authentication for V Russia. Copy over /etc/postgresql/17/main/pg_hba.conf, then: sudo systemctl reload postgresql
# Order matters: the first matching line wins. Nothing here accepts a connection from the internet.
# TYPE   DATABASE   USER        ADDRESS          METHOD
local    all        postgres                     peer            # the administrator: only as the Linux user "postgres" (sudo -u postgres psql)
local    vrussia    vr_backup                    scram-sha-256   # backups, through the Unix socket
host     vrussia    vr_app      127.0.0.1/32     scram-sha-256   # the running server
host     vrussia    vr_owner    127.0.0.1/32     scram-sha-256   # migrations
host     vrussia    vr_backup   127.0.0.1/32     scram-sha-256
# host   vrussia    vr_app      10.0.0.5/32      scram-sha-256   # (only if the API runs on another server of a PRIVATE network; use hostssl)
# everything else is refused (no matching line = no entry)
