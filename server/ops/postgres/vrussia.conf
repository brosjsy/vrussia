# PostgreSQL 17 settings for the V Russia database on a small VPS (2 vCPU, 4 GB RAM). Debian/Ubuntu: copy to
# /etc/postgresql/17/main/conf.d/vrussia.conf (that folder is included by default), then: sudo systemctl restart postgresql
# Adjust the memory lines to your machine: shared_buffers about 1/4 of RAM, effective_cache_size about 1/2 to 3/4.

# --- network: only this machine (the API runs here too). If the API is on another server, use the private network address and TLS.
listen_addresses = '127.0.0.1'
port = 5432
max_connections = 60
password_encryption = scram-sha-256
ssl = on                                   # Debian ships a snakeoil certificate; replace it if anything connects over a network

# --- memory and disk (4 GB RAM, SSD)
shared_buffers = 1GB
effective_cache_size = 3GB
work_mem = 8MB
maintenance_work_mem = 256MB
random_page_cost = 1.1
wal_compression = on
checkpoint_completion_target = 0.9

# --- safety
idle_in_transaction_session_timeout = 60s
statement_timeout = 0                      # the server role has its own 15 s limit (ops/db/00_roles.sql)

# --- point-in-time recovery (optional, see docs/DEPLOY_VPS.md "Backups, level 2"): keep WAL so the database can be restored to any minute
# archive_mode = on
# archive_command = 'test ! -f /var/lib/postgresql/wal-archive/%f && cp %p /var/lib/postgresql/wal-archive/%f'

# --- logs (who connected, slow queries, every schema change)
log_connections = on
log_disconnections = on
log_min_duration_statement = 1000
log_statement = 'ddl'
log_line_prefix = '%m [%p] %q%u@%d '
